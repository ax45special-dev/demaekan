name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: offer-judge-apk
          path: app/build/outputs/apk/debug/*.apk
      - run: cp routinetimer/build/outputs/apk/debug/routinetimer-debug.apk RoutineTimer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: routine-timer-apk
          path: RoutineTimer.apk
      # A fixed release gives a direct download link that opens on a phone without unzipping.
      - name: Publish routine timer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete routine-timer-latest --yes --cleanup-tag || true
          gh release create routine-timer-latest RoutineTimer.apk \
            --target "${{ github.sha }}" \
            --title "ルーティンタイマー (最新版)" \
            --notes "ブランチ ${{ github.ref_name }} のコミット ${{ github.sha }} からビルドしたAPKです。" \
            --prerelease
